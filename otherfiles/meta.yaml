{% set name = "typio" %}
{% set version = "1.4" %}

package:
    name: {{ name|lower }}
    version: {{ version }}
source:
    git_url: https://github.com/sepandhaghighi/typio
    git_rev: v{{ version }}
build:
    noarch: python
    number: 0
    script: {{ PYTHON }} -m pip install . -vv
requirements:
    host:
        - pip
        - setuptools
        - python >=3.8
    run:
        - python >=3.8
about:
    home: https://github.com/sepandhaghighi/typio
    license: MIT
    license_family: MIT
    summary: Make Your Terminal Type Like a Human
    description: |
        Typio is a lightweight Python library that prints text to the terminal as if it were being typed by a human.
        It supports multiple typing modes (character, word, line, sentence, typewriter, and adaptive),
        configurable delays and jitter for natural variation, and seamless integration with existing code
        via a simple function or a decorator. Typio is designed to be minimal, extensible, and safe,
        making it ideal for demos, CLIs, tutorials, and storytelling in the terminal.

        Repo: https://github.com/sepandhaghighi/typio
extra:
    recipe-maintainers:
        - sepandhaghighi
